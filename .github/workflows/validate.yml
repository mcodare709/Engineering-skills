name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source
        run: python scripts/validate_skill.py
      - name: Build package
        run: python scripts/package_skill.py
      - name: Inspect package
        run: python -m zipfile -l dist/engineering-research.zip
