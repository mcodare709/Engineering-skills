name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/validate_skill.py
      - name: Build downloads
        run: python scripts/build.py
      - name: Inspect skill archives
        run: |
          python -m zipfile -l dist/study-work-skill.zip
          python -m zipfile -l dist/caveman-skill.zip
      - name: Upload downloads
        uses: actions/upload-artifact@v4
        with:
          name: engineering-skills-downloads
          path: dist/
