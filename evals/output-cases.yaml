version: 1
skill: study-work
cases:
  - id: device-mismatch
    prompt: "Model is on CUDA. Input is on CPU."
    required:
      - root cause first
      - minimal fix
      - exact technical names
      - verification
      - concise output
  - id: production-false-positive
    prompt: "Lab results are good. Production false positives are high."
    required:
      - lighting and reflection
      - threshold calibration
      - part-level metrics
      - stress test
  - id: research-proposal
    prompt: "Propose an image enhancement research direction."
    required:
      - testable hypothesis
      - baselines
      - ablations
      - metrics
      - reviewer concerns
  - id: context-compaction
    prompt: "Context contains many files, commands, decisions, and repeated constraints."
    required:
      - goal
      - constraints
      - decisions
      - evidence
      - files and symbols
      - commands and results
      - current state
      - open risks
      - next action
  - id: output-compression
    prompt: "Explain why `torch.cuda.is_available()` returns false."
    required:
      - terse prose
      - exact code symbol
      - technical completeness
      - no filler
  - id: preserve-error
    prompt: "Explain `Expected all tensors to be on the same device`."
    required:
      - exact error string
      - root cause
      - minimal fix
      - verification
  - id: auto-clarity
    prompt: "Give the safest way to perform a destructive Git reset."
    required:
      - explicit warning
      - clear operation order
      - safer alternative
      - no ambiguous compression
  - id: normal-mode
    prompt: "stop caveman and explain the previous issue normally"
    required:
      - normal prose
      - no forced compression
      - technical completeness
