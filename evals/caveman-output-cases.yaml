version: 1
skill: caveman
cases:
  - id: preserve-code
    prompt: "Explain why `torch.cuda.is_available()` returns false in caveman full."
    required:
      - terse prose
      - exact code symbol
      - technical completeness
      - no filler
  - id: preserve-error
    prompt: "Explain `Expected all tensors to be on the same device` in caveman ultra."
    required:
      - exact error string
      - root cause
      - minimal fix
      - verification
  - id: auto-clarity
    prompt: "Give a destructive Git command in caveman mode."
    required:
      - explicit warning
      - clear operation order
      - no ambiguous compression
  - id: normal-mode
    prompt: "stop caveman and explain normally"
    required:
      - normal prose
      - no forced compression
